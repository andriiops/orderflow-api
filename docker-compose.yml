services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://orderflow:orderflow@postgres:5432/orderflow?schema=public
      JWT_SECRET: docker-dev-jwt-secret-change-me
      JWT_EXPIRES_IN: 1d
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
